name: Build FX.01 Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'npm' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install deps
        run: npm ci || npm install
      - name: Build web
        run: npm run build --if-present; ls -la
      - name: Cap sync
        run: npx cap sync android || npx cap copy android || true; npx cap sync || true
      - name: Make gradlew executable
        run: chmod +x android/gradlew || true
      - name: Build Debug APK
        working-directory: android
        run:./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fx01-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Build AAB Release
        working-directory: android
        run:./gradlew bundleRelease --stacktrace || true
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: fx01-aab-release
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14
