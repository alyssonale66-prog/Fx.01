name: build-android
on:
  push:
    branches: [ principal, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: |
          npm install --legacy-peer-deps

      - name: Executar Build Web (pasta www)
        run: |
          npm run build

      - name: Criar configuração do Capacitor - FX Finance
        run: |
          echo '{"appId":"com.fx.finance","appName":"FX Finance","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json

      - name: Preparar plataforma Android - RECRIAR DO ZERO
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Gerar Ícones e Splash do App
        run: |
          npx @capacitor/assets generate --android --iconPath assets/icon.png

      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK e AAB
        run: |
          cd android
          ./gradlew assembleDebug
          ./gradlew bundleRelease

      - name: Decodificar Keystore e Assinar AAB com jarsigner
        run: |
          echo "${{ secrets.FX_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          AAB_PATH=$(ls android/app/build/outputs/bundle/release/*.aab | head -n 1)
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "${{ secrets.FX_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.FX_KEYSTORE_PASSWORD }}" \
            "$AAB_PATH" \
            "${{ secrets.FX_KEY_ALIAS }}"

      - name: Organizar Artefatos de Saída
        run: |
          mkdir -p dist-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-artifacts/FX-Finance.apk
          AAB_PATH=$(ls android/app/build/outputs/bundle/release/*.aab | head -n 1)
          cp "$AAB_PATH" dist-artifacts/FX-Finance-Release.aab

      - name: Disponibilizar Artefatos (APK + AAB Assinado)
        uses: actions/upload-artifact@v4
        with:
          name: FX-Financas-v${{ github.run_number }}
          path: dist-artifacts/
