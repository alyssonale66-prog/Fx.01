name: Crie o APK e o AAB do FX.01 para Android

on:
  push:
    branches:
      - main
      - master
      - principal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm install

      - name: Preparar web assets
        run: |
          rm -rf www
          mkdir -p www

          npm run build

          test -f www/index.html
          test -f www/app.js
          test -f www/style.css
          test -f www/manifest.json
          test -f www/service-worker.js

          if [ -f icon-192.png ]; then
            cp icon-192.png www/
          fi

          if [ -f icon-512.png ]; then
            cp icon-512.png www/
          fi

          echo "Conteúdo final de www:"
          find www -maxdepth 2 -type f -print

      - name: Criar configuração do Capacitor
        run: |
          if [ ! -f capacitor.config.json ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.fx.app",
            "appName": "FX.01",
            "webDir": "www"
          }
          EOF
          fi

          cat capacitor.config.json

      - name: Preparar plataforma Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew

      - name: Verificar versão do Gradle
        working-directory: android
        run: ./gradlew --version

      - name: Compilar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Renomear APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             artifacts/FX.01-v1.1.0-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: FX01-APK-v1.1.0
          path: artifacts/FX.01-v1.1.0-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Compilar AAB Release
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Disponibilizar AAB
        uses: actions/upload-artifact@v4
        with:
          name: FX01-AAB-v1.1.0
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
