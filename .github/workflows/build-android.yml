name: build-android
on:
  push:
    branches: [ principal, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: |
          npm install --legacy-peer-deps

      - name: Executar Build Web (pasta www)
        run: |
          npm run build

      - name: Criar configuração do Capacitor - FX Finance
        run: |
          echo '{"appId":"com.fx.finance","appName":"FX Finance","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
          cat capacitor.config.json

      - name: Preparar plataforma Android - RECRIAR DO ZERO
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug - FX Finance
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Renomear APK para FX Finance
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "FX-Finance-v${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "FX-Finance.apk"
          ls -lh android/app/build/outputs/apk/debug/
          ls -lh *.apk

      - name: Disponibilizar APK FX Finance
        uses: actions/upload-artifact@v4
        with:
          name: FX-Finance-APK-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            FX-Finance-v${{ github.run_number }}.apk
            FX-Finance.apk

