name: Build FX.01 Android APK & AAB

on:
  push:
    branches: [ main, master, principal ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependências NPM
        run: npm install

      - name: Sincronizar arquivos Web e Capacitor
        run: |
          npm run build
          if [ -d "js" ]; then cp -r js/ www/js/; fi
          if [ -f "crypto.js" ]; then cp crypto.js www/; fi
          npx cap sync android || true

      - name: Dar permissão de execução ao Gradlew
        run: chmod +x android/gradlew || true

      - name: Compilar Debug APK (Para Teste)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: FX01-APK-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Compilar Release AAB (Para Play Store)
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Disponibilizar AAB como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: FX01-AAB-Release
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
