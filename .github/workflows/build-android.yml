name: Construir FX Android

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Gerar APK Release do FX
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar projeto
        run: |
          mkdir -p www

          cp index.html www/
          cp style.css www/
          cp app.js www/
          cp manifest.json www/
          cp service-worker.js www/
          cp icon-192.png www/
          cp icon-512.png www/

          cat > package.json <<'EOF'
          {
            "name": "fx-android",
            "private": true,
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/core": "8.5.0",
              "@capacitor/android": "8.5.0"
            },
            "devDependencies": {
              "@capacitor/cli": "8.5.0",
              "@capacitor/assets": "3.0.5"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.fx01.app",
            "appName": "FX",
            "webDir": "www",
            "android": {
              "backgroundColor": "#0a0a0a"
            }
          }
          EOF

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: |
          rm -rf android
          npx cap add android

      - name: Gerar ícones Android
        run: |
          mkdir -p resources
          cp icon-512.png resources/icon.png

          npx capacitor-assets generate \
            --android \
            --iconBackgroundColor "#0a0a0a" \
            --iconBackgroundColorDark "#0a0a0a"

      - name: Sincronizar projeto
        run: npx cap sync android

      - name: Preparar assinatura
        env:
          FX_KEYSTORE_BASE64: ${{ secrets.FX_KEYSTORE_BASE64 }}
        run: |
          echo "$FX_KEYSTORE_BASE64" | base64 --decode > fx-release.jks

      - name: Gerar APK Release assinado
        working-directory: android
        env:
          FX_KEYSTORE_PASSWORD: ${{ secrets.FX_KEYSTORE_PASSWORD }}
          FX_KEY_ALIAS: ${{ secrets.FX_KEY_ALIAS }}
        run: |
          chmod +x gradlew

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/fx-release.jks" \
            -Pandroid.injected.signing.store.password="$FX_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$FX_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$FX_KEYSTORE_PASSWORD"

      - name: Disponibilizar APK Release
        uses: actions/upload-artifact@v4
        with:
          name: FX-APK-RELEASE
          path: android/app/build/outputs/apk/release/app-release.apk
