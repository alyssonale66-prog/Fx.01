name: Build FX.01 Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependências do projeto
        run: npm ci || npm install

      - name: Build Web
        run: |
          npm run build --if-present
          ls -la

      - name: Sincronizar Capacitor Android
        run: |
          npx cap sync android || npx cap copy android || true

      - name: Dar permissão de execução ao Gradlew
        run: chmod +x android/gradlew || true

      - name: Gerar Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fx01-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Gerar Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Disponibilizar AAB como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fx01-aab-release
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14
