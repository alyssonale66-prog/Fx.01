name: build-android
on:
  push:
    branches: [ principal, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # SEM cache: 'npm' - remove essa linha

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Preparar web assets
        run: |
          mkdir -p icons
          [ -f "icon-192.png" ] && cp icon-192.png icons/icon-192.png || true
          [ -f "icon-512.png" ] && cp icon-512.png icons/icon-512.png || true
          [ -f "icons/icon-192.png" ] && [ ! -f "icon-192.png" ] && cp icons/icon-192.png icon-192.png || true
          [ -f "icons/icon-512.png" ] && [ ! -f "icon-512.png" ] && cp icons/icon-512.png icon-512.png || true
          ls -la *.png || true
          ls -la icons/ || true

      - name: Criar configuração do Capacitor
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            echo '{"appId":"com.fx.app","appName":"FX","webDir":".","bundledWebRuntime":false}' > capacitor.config.json
          fi
          cat capacitor.config.json || cat capacitor.config.ts || echo "sem config"

      - name: Preparar plataforma Android
        run: |
          npx cap add android || true
          npx cap sync android || true

      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew || true

      - name: Verificar versão do Gradle
        run: cd android && ./gradlew --version || true

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Renomear APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FX-v${{ github.run_number }}.apk || true
          ls -lh android/app/build/outputs/apk/debug/ || true
          ls -lh *.apk || true

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: FX-APK-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            *.apk
          if-no-files-found: warn
