name: Crie o APK e o AAB do FX.01 para Android.

on:
  push:
    branches: [ main, master, principal ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências NPM
        run: npm install

      - name: Preparar web assets
        run: |
          mkdir -p www/icons
          npm run build --if-present || true
          cp index.html www/ 2>/dev/null || true
          cp app.js www/ 2>/dev/null || true
          cp style.css www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true
          cp service-worker.js www/ 2>/dev/null || true
          cp icons/*.png www/icons/ 2>/dev/null || true
          cp icon-*.png www/icons/ 2>/dev/null || true
          cd www/icons || exit 0
          for f in *.png; do
            case "$f" in
              *192*) cp "$f" icon-192.png 2>/dev/null || true ;;
              *512*) cp "$f" icon-512.png 2>/dev/null || true ;;
            esac
          done
          ls -la

      - name: Sincronizar e Gerar Plataforma Android
        run: |
          if [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"com.fx.app","appName":"FX.01","webDir":"www"}' > capacitor.config.json
          fi
          if [ ! -f "android/gradlew" ]; then
            rm -rf android
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          npx cap copy android

      - name: Dar permissão ao Gradlew
        run: chmod +x android/gradlew

      - name: Compilar Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: FX01-APK-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Compilar Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace || ./gradlew bundleDebug --stacktrace

      - name: Disponibilizar AAB
        uses: actions/upload-artifact@v4
        with:
          name: FX01-AAB-Release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: warn
          retention-days: 14
