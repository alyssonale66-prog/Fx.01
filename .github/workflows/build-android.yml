name: Build FX.01 Android APK

on:
  push:
    branches: [ main, master, principal ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar dependências e estrutura Web
        run: |
          npm install --no-audit --no-fund
          mkdir -p www
          cp -r index.html style.css app.js manifest.json service-worker.js icon-192.png icon-512.png www/ 2>/dev/null || true
          if [ -d "js" ]; then cp -r js www/; fi

      - name: Sincronizar Capacitor Android
        run: |
          npx cap sync android || npx cap copy android || true

      - name: Dar permissão de execução ao Gradlew
        run: chmod +x android/gradlew || true

      - name: Gerar Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fx01-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Gerar Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace || true

      - name: Disponibilizar AAB como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fx01-aab-release
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14
